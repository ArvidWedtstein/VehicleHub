name: Fetch exchange rates

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      from:
        description: "Backfill start date (YYYY-MM-DD). Leave empty for the normal run."
        required: false
        default: ""

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call rates endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FROM: ${{ inputs.from }}
        run: |
          url="$APP_URL/api/cron/rates"
          if [ -n "$FROM" ]; then url="$url?from=$FROM"; fi
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 120 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$url"
