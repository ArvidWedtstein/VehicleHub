name: Supabase

on:
  schedule:
    - cron: "0 0 */3 * *"  
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set sort_order to 1
        run: |
          curl -X PATCH 'https://akhxphgocxpyoofvdqwi.supabase.co/rest/v1/VehicleManufacturers?id=eq.67' \
          -H "apikey: ${{ secrets.SUPABASE_SECRET_TOKEN }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SECRET_TOKEN }}" \
          -H "Content-Type: application/json" \
          -H "Prefer: return=minimal" \
          -d '{ "sort_order": 1 }'
      - name: Set sort_order to 0
        run: |
          curl -X PATCH 'https://akhxphgocxpyoofvdqwi.supabase.co/rest/v1/VehicleManufacturers?id=eq.67' \
          -H "apikey: ${{ secrets.SUPABASE_SECRET_TOKEN }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SECRET_TOKEN }}" \
          -H "Content-Type: application/json" \
          -H "Prefer: return=minimal" \
          -d '{ "sort_order": 0 }'
          
