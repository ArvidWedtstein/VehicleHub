name: E2E Tests

on:
  #push:
  #  branches: [prod]
  #pull_request:
  #  branches: [prod]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Nuxt app
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run Playwright tests
        run: npx playwright test
        env:
          # Tells Playwright (via your nuxt.config / playwright.config) where the app will be served
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: true
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_REF_ID }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
